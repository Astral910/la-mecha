function tono(freq, dur, tipo, vol, cuando, destino) {
if (!ac) return;
const t = cuando == null ? ac.currentTime : cuando;
const o = ac.createOscillator();
const g = ac.createGain();
o.type = tipo;
o.frequency.setValueAtTime(Math.max(40, freq), t);
if (destino) o.frequency.exponentialRampToValueAtTime(Math.max(40, destino), t + dur);

g.gain.exponentialRampToValueAtTime(0.001, t + dur);

g.connect(master);
o.start(t);
o.stop(t + dur + 0.02);

function chasquido() {

f.frequency.value = 700;
const g = ac.createGain();
const t = ac.currentTime;
g.gain.setValueAtTime(0.4, t);
g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
src.connect(f);
f.connect(g);
g.connect(master);

src.stop(t + 0.08);

function fanfarria() {

tono(523, 0.08, "square", 0.16, t);

tono(784, 0.16, "square", 0.18, t + 0.14);

}
function ganar() {
S.juzgado = true;
S.pose = "bien";
S.modo = "impacto";

S.cara = "feliz";
S.ronda++;
S.shake = 8;
S.flash = 1;

function perder(tipo) {
if (S.juzgado) return;

S.pose = tipo;
S.modo = "impacto";

S.cara = "cruz";

acelerar();

}
function salir() {

}

S.t = 0;
tono(S.cara === "feliz" ? 720 : 150, 0.08, "square", 0.12);

function reiniciar() {

S.vidas = 4;
S.ronda = 0;
S.ventana = 500;
S.dur = 1400;

function enZona() {

function pulso(e) {

S.modo = "cuarto";
S.t = 0;

}

function cuadro(ahora) {
